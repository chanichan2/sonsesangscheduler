<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>댄스 연습 일정 분석 — 손세상</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1>댄스 연습 일정 분석</h1>
    <div class="header-meta">
      <span id="last-updated" class="muted">데이터 미로드</span>
      <button id="refresh-btn" class="primary-btn" type="button">새로고침</button>
    </div>
  </div>
</header>

<div id="alert-banner" class="alert-banner hidden" role="alert"></div>

<section class="controls">
  <div class="controls-inner">
    <div class="control-group">
      <label for="threshold-slider">
        참여율 임계값
        <span class="threshold-readout"><span id="threshold-value">60</span>%</span>
      </label>
      <input type="range" id="threshold-slider" min="0" max="100" step="5" value="60">
    </div>
    <div class="control-group">
      <label>표시 형식</label>
      <div class="toggle-group view-mode-toggle">
        <button class="toggle-btn active" data-view="A" type="button">인원수만</button>
        <button class="toggle-btn" data-view="B" type="button">상세 명단</button>
      </div>
    </div>
  </div>
</section>

<main id="main-content">
  <div id="loading" class="loading">데이터 로딩 중...</div>
  <div id="error" class="error hidden"></div>

  <section id="heatmap-section" class="output-section">
    <h2>곡별 시간대별 참여 가능 인원</h2>
    <p class="section-desc">
      각 셀의 숫자는 30분 이상 참여 가능한 멤버 수입니다. 1~29분만 가능한 부원은 명단에 연한 색으로 함께 표시됩니다.
      셀을 클릭하면 그 시간을 팀 연습 일정으로 잡을 수 있고(다시 클릭하면 해제), 같은 시간대의 다른 곡 표에서는 그 부원이 취소선으로 처리됩니다. 잡은 일정은 새로고침해도 유지됩니다.
      배경색은 참여율을 의미하며, 임계값 미만인 슬롯은 흐림 처리됩니다.
    </p>
    <div id="heatmaps"></div>
  </section>
</main>

<footer class="app-footer">
  <p>손세상 · 정적 SPA · 클라이언트 사이드 전용</p>
</footer>

<script src="app.js"></script>
</body>
</html>
